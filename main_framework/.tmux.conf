unbind C-Space
set -g prefix C-Space

# Enables tmux to forward OSC 52 clipboard sequences out to the terminal,
# and to generate its own OSC 52 sequence when text is copied in copy-mode
set -g set-clipboard on

# Lets raw escape sequences (like Neovim's OSC 52 writes) pass straight
# through tmux to the outer terminal, instead of being swallowed
set -g allow-passthrough on

bind C-Space send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer

# Copies the copy-mode selection into tmux's buffer and exits copy-mode.
# set-clipboard/allow-passthrough above handle pushing it to the system
# clipboard - no external tool (xclip, wl-copy, etc.) needed here
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

